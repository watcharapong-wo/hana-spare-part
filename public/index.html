<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Spare Parts Management - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                    <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                    <line x1="6" y1="6" x2="6.01" y2="6"></line>
                    <line x1="6" y1="18" x2="6.01" y2="18"></line>
                </svg>
            </div>
            <h1>IT Spare Parts Management</h1>
            <p class="subtitle">ระบบจัดการอะไหล่ IT</p>
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div id="errorMessage" class="error-message error-message-inline"></div>
                <button type="submit" class="btn btn-primary btn-block">
                    <span id="loginText">เข้าสู่ระบบ</span>
                    <span id="loginSpinner" class="spinner spinner-hidden"></span>
                </button>
            </form>
            <div class="demo-credentials">
                <div class="demo-credentials-box">
                    <div class="demo-credentials-title">Program V1.0</div>
                    <div class="demo-credentials-row demo-credentials-row1">
                        <span class="demo-credentials-icon1">👑</span>
                        <span class="demo-credentials-label">Creator:</span>
                        <span class="demo-credentials-name">Watcharapong W.</span>
                    </div>
                    <div class="demo-credentials-row demo-credentials-row2">
                        <span class="demo-credentials-icon2">👤</span>
                        <span class="demo-credentials-label">IT#373</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script type="module" src="/js/login.js"></script>
    <!-- Handler moved to login.js module -->
</body>
</html>
